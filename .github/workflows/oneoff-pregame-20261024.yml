name: October 24 one-off pregame research
on:
  push:
    branches: [runs/pregame-2026-10-24]
    paths:
      - '.github/workflows/oneoff-pregame-20261024.yml'
      - 'scripts/requests/run_20261024.py'
permissions:
  contents: read
concurrency:
  group: oneoff-pregame-20261024
  cancel-in-progress: false
jobs:
  execute:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        league: [cfb, nba, nhl, scope]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original code and scope remain unchanged
        run: |
          python - <<'PY'
          import subprocess
          base='2fbfaa687c03c8736fd14e329c9f16fa3d101386'
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert changed <= {'.github/workflows/oneoff-pregame-20261024.yml','scripts/requests/run_20261024.py'}, changed
          assert subprocess.check_output(['git','branch','--show-current'],text=True).strip() == 'runs/pregame-2026-10-24'
          print('Original source, models, defaults, fitted research artifacts, forecasts and ledgers unchanged:',base)
          PY
          python -m py_compile scripts/requests/run_20261024.py
      - run: python -m pip install -r requirements-consolidated.txt
      - name: Retain input and numerical-contract regressions
        run: |
          mkdir -p run-output
          python -m pytest tests/test_current_runtime_contracts.py tests/test_nba_history_scope.py tests/test_nhl_atomic_capture.py tests/test_semantic_identity.py -q | tee run-output/${{ matrix.league }}-tests.txt
      - name: Record health separately, without claiming global acceptance
        if: matrix.league == 'scope'
        run: |
          set +e
          python harness/healthcheck.py > run-output/health.txt 2>&1
          code=$?
          echo "HEALTH_EXIT=$code"
          grep -E 'FAIL|WARN|REPOSITORY_HEALTH' run-output/health.txt || true
          exit 0
      - name: Execute existing source-bound preparation and actual card runner
        run: |
          set -o pipefail
          python scripts/requests/run_20261024.py ${{ matrix.league }} | tee run-output/${{ matrix.league }}-console.log
      - name: Publish exact executed results or named blockers
        if: always()
        run: |
          echo '## October 24, 2026 Pacific — research execution' >> "$GITHUB_STEP_SUMMARY"
          echo 'Action OFF. No main write, scheduled deployment, canonical registration or predictive promotion.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f run-output/${{ matrix.league }}/summary.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat run-output/${{ matrix.league }}/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain exact source, forecast, simulation and command evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: october24-${{ matrix.league }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            run-output/${{ matrix.league }}-evidence.zip
            run-output/${{ matrix.league }}-console.log
            run-output/${{ matrix.league }}-tests.txt
            run-output/health.txt
          retention-days: 7
          if-no-files-found: error
