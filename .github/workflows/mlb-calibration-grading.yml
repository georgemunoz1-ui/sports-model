name: MLB Calibration Grading

on:
  workflow_dispatch:
    inputs:
      grade_date:
        description: "Optional registered card date YYYY-MM-DD; blank grades all pending"
        required: false
        type: string
      forecast_run_id:
        description: "Optional assertion of an already registered forecast run ID"
        required: false
        type: string
  schedule:
    # After the prior MLB slate is normally final. Scheduled workflows execute
    # only from the repository default branch, so this becomes active after merge.
    - cron: "30 13 * * *"
  push:
    branches:
      - codex/nfl-wnba-nba-models-v1
    paths:
      - "grading_requests/*.json"

concurrency:
  group: mlb-calibration-state-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  GH_TOKEN: ${{ github.token }}

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve grading request
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_GRADE_DATE: ${{ inputs.grade_date }}
          INPUT_FORECAST_RUN_ID: ${{ inputs.forecast_run_id }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from datetime import datetime
          from pathlib import Path

          event = os.environ["EVENT_NAME"]
          grade_date = (os.environ.get("INPUT_GRADE_DATE") or "").strip()
          run_id = (os.environ.get("INPUT_FORECAST_RUN_ID") or "").strip()
          if event == "push":
              names = subprocess.check_output(
                  ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", os.environ["GITHUB_SHA"]],
                  text=True,
              ).splitlines()
              candidates = sorted(n for n in names if n.startswith("grading_requests/") and n.endswith(".json"))
              if not candidates:
                  raise SystemExit("GRADING_REQUEST_FILE_NOT_FOUND")
              req = json.loads(Path(candidates[-1]).read_text())
              grade_date = str(req.get("grade_date") or "").strip()
              run_id = str(req.get("forecast_run_id") or "").strip()
          elif event == "schedule":
              # Retry every registered pending card, including postponed/partial slates.
              grade_date = ""

          if grade_date:
              datetime.fromisoformat(grade_date)
          if run_id and not grade_date:
              raise SystemExit("forecast_run_id requires grade_date")

          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"grade_date={grade_date}\n")
              handle.write(f"run_id={run_id}\n")
          print(json.dumps({"grade_date": grade_date, "run_id": run_id}, indent=2))
          PY

      - name: Verify explicit forecast run assertion
        if: ${{ steps.resolve.outputs.run_id != '' }}
        shell: bash
        env:
          GRADE_DATE: ${{ steps.resolve.outputs.grade_date }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          registry = json.loads(Path("data/grading/mlb/registry.json").read_text())
          entry = registry["cards"].get(os.environ["GRADE_DATE"])
          if not entry or int(entry["run_id"]) != int(os.environ["RUN_ID"]):
              raise SystemExit("PREGAME_REGISTRATION_REQUIRED: use the daily card writer before first pitch")
          PYCODE

      - name: Grade registered forecast card(s)
        id: grade
        continue-on-error: true
        shell: bash
        env:
          GRADE_DATE: ${{ steps.resolve.outputs.grade_date }}
        run: |
          mkdir -p output/mlb_grading
          args=()
          if [ -n "$GRADE_DATE" ]; then args+=(--grade-date "$GRADE_DATE"); fi
          python scripts/grade_mlb_registry.py \
            --registry data/grading/mlb/registry.json \
            --ledger data/grading/mlb/calibration_ledger.jsonl \
            --summary data/grading/mlb/calibration_summary.json \
            --output-dir output/mlb_grading \
            "${args[@]}"

      - name: Publish calibration summary
        if: always()
        shell: bash
        run: |
          echo '## MLB Probability Calibration' >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/grading/mlb/calibration_summary.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat data/grading/mlb/calibration_summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f output/mlb_grading/registry_grade_run.json ]; then
            echo '### Grade run' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat output/mlb_grading/registry_grade_run.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '**Market overlay: OFF · Action authority: OFF**' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit durable grading state
        id: persist
        if: ${{ steps.grade.outcome == 'success' }}
        shell: bash
        env:
          GRADE_DATE: ${{ steps.resolve.outputs.grade_date }}
        run: |
          git config user.name "sports-model-calibration-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/grading/mlb/registry.json
          if [ -d data/grading/mlb/results ]; then git add data/grading/mlb/results; fi
          if [ -f data/grading/mlb/calibration_ledger.jsonl ]; then git add data/grading/mlb/calibration_ledger.jsonl; fi
          if [ -f data/grading/mlb/calibration_summary.json ]; then git add data/grading/mlb/calibration_summary.json; fi
          if git diff --cached --quiet; then
            echo "No durable grading changes"
            # Suppress only a proven empty selection with unchanged durable state.
            # Missing/malformed reports retain evidence through the default upload.
            python - <<'PY'
          import json, os
          from pathlib import Path
          try:
              report = json.loads(Path("output/mlb_grading/registry_grade_run.json").read_text())
          except (OSError, ValueError):
              report = None
          noop = (isinstance(report, dict)
                  and report.get("status") == "NO_ELIGIBLE_FORECASTS"
                  and all(type(report.get(k)) is int and report[k] == 0
                          for k in ("selected_count", "grade_count", "added_count"))
                  and report.get("errors") == [] and report.get("results") == [])
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"noop={str(noop).lower()}\n")
          PY
          else
            git commit -m "Grade MLB calibration forecasts ${GRADE_DATE:-pending cards}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload grading report
        if: ${{ always() && (github.event_name != 'schedule' || failure() || cancelled() || steps.grade.outcome != 'success' || steps.persist.outcome != 'success' || steps.persist.outputs.noop != 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: mlb-calibration-grading-${{ steps.resolve.outputs.grade_date }}-${{ github.run_id }}
          path: |
            output/mlb_grading/
            data/grading/mlb/registry.json
            data/grading/mlb/calibration_ledger.jsonl
            data/grading/mlb/calibration_summary.json
          if-no-files-found: warn
          retention-days: 90

      - name: Fail unsuccessful grading
        if: ${{ steps.grade.outcome == 'failure' }}
        run: exit 1
