name: Finalize MLB backfill 2026-09-02

on:
  push:
    branches:
      - backfill-2026-09-02

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backfill-2026-09-02
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository healthcheck dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pytest

      - name: Bind official actual starters into canonical starters.csv
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          from collections import Counter
          E='data/mlb/evidence/backfill_starters_2026-08-24_2026-09-02.json'
          R='data/backfill/mlb/2026/results.csv'
          S='data/backfill/mlb/2026/starters.csv'
          ev=json.load(open(E)); slots=ev['starter_slots']; assert len(slots)==270
          results=list(csv.DictReader(open(R,newline='',encoding='utf-8')))
          target=[r for r in results if r['status']=='final' and '2026-08-24'<=r['date']<='2026-09-02']
          assert len(target)==135
          abbr={
            'Arizona Diamondbacks':'AZ','Athletics':'ATH','Atlanta Braves':'ATL','Baltimore Orioles':'BAL',
            'Boston Red Sox':'BOS','Chicago Cubs':'CHC','Chicago White Sox':'CWS','Cincinnati Reds':'CIN',
            'Cleveland Guardians':'CLE','Colorado Rockies':'COL','Detroit Tigers':'DET','Houston Astros':'HOU',
            'Kansas City Royals':'KC','Los Angeles Angels':'LAA','Los Angeles Dodgers':'LAD','Miami Marlins':'MIA',
            'Milwaukee Brewers':'MIL','Minnesota Twins':'MIN','New York Mets':'NYM','New York Yankees':'NYY',
            'Philadelphia Phillies':'PHI','Pittsburgh Pirates':'PIT','San Diego Padres':'SD','San Francisco Giants':'SF',
            'Seattle Mariners':'SEA','St. Louis Cardinals':'STL','Tampa Bay Rays':'TB','Texas Rangers':'TEX',
            'Toronto Blue Jays':'TOR','Washington Nationals':'WSH'}
          byslot={(x['gamePk'],x['side']):x for x in slots}
          assert len(byslot)==270
          official={}
          for r in target:
            pk=r['game_id'].rsplit(':',1)[-1]
            a=byslot[(pk,'away')]; h=byslot[(pk,'home')]
            official[pk]='|'.join([pk,r['date'],abbr[r['away']],abbr[r['home']],r['venue'],a['pitcher_id'],a['pitcher_name'],h['pitcher_id'],h['pitcher_name']])
          lines=Path(S).read_text(encoding='utf-8').splitlines()
          header=lines[0]; assert header=='gamePk|date|away|home|venue|asp_id|asp_name|hsp_id|hsp_name'
          current={ln.split('|',1)[0]:ln for ln in lines[1:] if ln.strip()}
          replaced=0; added=0; same=0
          for pk,ln in official.items():
            if pk not in current: added+=1
            elif current[pk]==ln: same+=1
            else: replaced+=1
            current[pk]=ln
          def key(ln):
            p=ln.split('|'); return (p[1],int(p[0]))
          out=header+'\n'+'\n'.join(sorted(current.values(),key=key))+'\n'
          Path(S).write_text(out,encoding='utf-8')
          check={ln.split('|',1)[0]:ln for ln in Path(S).read_text().splitlines()[1:] if ln}
          assert all(check[pk]==ln for pk,ln in official.items())
          print(f'STARTERS_CSV_OK target=135 added={added} replaced={replaced} already_same={same}')
          PY

      - name: Rebuild point-in-time MLB ML dataset from repaired canonical data
        run: |
          python harness/build_ml_asof.py
          python harness/build_ml_asof.py --check

      - name: Update backfill report with downstream rebuild coverage
        run: |
          python - <<'PY'
          import csv,json
          p='reports/backfill/2026-09-02_mlb_gap_backfill.json'
          d=json.load(open(p))
          starts=[ln for ln in open('data/backfill/mlb/2026/starters.csv') if ln.strip()][1:]
          rows=[ln for ln in starts if '2026-08-24'<=ln.split('|')[1]<='2026-09-02']
          assert len(rows)==135
          m=json.load(open('data/mlb/ml_asof/manifest.json'))
          d['starters_csv_target_games']=135
          d['starters_csv_bound_games']=len(rows)
          d['starters_csv_coverage_pct']=100.0
          d['ml_asof_rebuilt']=True
          d['ml_asof_row_count']=m['row_count']
          d['ml_asof_eligible_for_evaluation']=m['eligible_for_evaluation']
          d['ml_asof_flagged_rows']=m['flagged_rows']
          d['ml_asof_vintage_sha256']=m['vintage_sha256']
          open(p,'w').write(json.dumps(d,indent=1,sort_keys=True)+'\n')
          PY

      - name: Run full repository healthcheck with runtime dependencies
        id: health
        shell: bash
        run: |
          set +e
          python harness/healthcheck.py > healthcheck-finalize.log 2>&1
          code=$?
          cat healthcheck-finalize.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload final healthcheck log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthcheck-finalize-log
          path: healthcheck-finalize.log

      - name: Bind final healthcheck status into report
        if: always()
        env:
          HEALTH_EXIT: ${{ steps.health.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json,os
          p='reports/backfill/2026-09-02_mlb_gap_backfill.json'
          d=json.load(open(p)); code=int(os.environ.get('HEALTH_EXIT') or 999)
          d['healthcheck']={'status':'PASS' if code==0 else 'FAIL','exit_code':code,'log_artifact':'healthcheck-finalize-log','dependencies':['numpy','pandas','pytest']}
          open(p,'w').write(json.dumps(d,indent=1,sort_keys=True)+'\n')
          PY

      - name: Commit downstream canonical rebuild
        run: |
          git config user.name 'sports-model-backfill-bot'
          git config user.email 'sports-model-backfill-bot@users.noreply.github.com'
          git add data/backfill/mlb/2026/starters.csv data/mlb/ml_asof reports/backfill/2026-09-02_mlb_gap_backfill.json
          if git diff --cached --quiet; then
            echo 'No downstream changes required'
            exit 0
          fi
          git commit -m 'Rebuild MLB as-of data through 2026-09-02'
          git push origin HEAD:backfill-2026-09-02

      - name: Enforce final repository health after preserving diagnostics
        if: steps.health.outputs.exit_code != '0'
        run: exit 1
