name: P0-A isolated mapper regression
on:
  push:
    branches: [research/p0a-cbb-mapper-20261126]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-pytest:
    if: github.ref == 'refs/heads/research/p0a-cbb-mapper-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin source and install dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/p0a"
          git rev-parse HEAD | tee "$RUNNER_TEMP/p0a/checkout.txt"
          test "$(git rev-parse HEAD:pipelines/cards/semantic_identity.py)" = 0ba86fac8341b99b82728ad51e165d8135328afa
          python -m pip install -r requirements-consolidated.txt
      - name: Run full repository pytest
        shell: bash
        run: |
          set +e
          python -m pytest tests research/tests research/cfb_binary_isotonic_proposal/test_binary_isotonic_repair.py -q --junitxml="$RUNNER_TEMP/p0a/pytest.xml" > "$RUNNER_TEMP/p0a/pytest.log" 2>&1
          rc=$?
          printf '%s\n' "$rc" > "$RUNNER_TEMP/p0a/pytest-exit.txt"
          cat "$RUNNER_TEMP/p0a/pytest.log"
          exit "$rc"
      - name: Replay pinned native NFL feature access and retain runtime receipt
        shell: bash
        run: |
          set -euo pipefail
          data=data/nfl/contextual_v1
          ref=91ab1262dd646dbbc1568c21baf5b6ef26fab43c
          # Independent repository commit pin for the original retained replay inputs.
          pin() { git show "$ref:$1" | sha256sum | cut -d' ' -f1; }
          python -m research.native_feature_access nfl \
            --package "$data/event_package_v2.json" --package-sha "$(pin "$data/event_package_v2.json")" \
            --model "$data/model_packed.json" --model-sha "$(pin "$data/model_packed.json")" \
            --recovered "$data/recovered_parameters.json" --recovered-sha "$(pin "$data/recovered_parameters.json")" \
            --event-id 2026_01_DEN_KC --cutoff 2026-09-14T12:00:00Z \
            --output "$RUNNER_TEMP/p0a/native-feature-access-nfl.json" | tee "$RUNNER_TEMP/p0a/native-feature-access.log"
          actual=$(sha256sum "$RUNNER_TEMP/p0a/native-feature-access-nfl.json" | cut -d' ' -f1)
          grep -Fx "NATIVE_FEATURE_ACCESS_RECEIPT_SHA256=$actual" "$RUNNER_TEMP/p0a/native-feature-access.log"
          test "$(git rev-parse HEAD:data/model_selection/defaults_v1.json)" = 4838f3daf447ada3525d41daae1375b769130296
      - name: Retain evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/p0a"
          cd "$RUNNER_TEMP/p0a"
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0a-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p0a/
          if-no-files-found: error
          retention-days: 7
