name: CFB Fit Margin Model
on:
  workflow_dispatch:
    inputs:
      train_start:
        description: Training start YYYY-MM-DD
        required: true
        type: string
      train_end:
        description: Training end YYYY-MM-DD
        required: true
        type: string
      calibration_start:
        description: Calibration start YYYY-MM-DD (UTC; after training)
        required: true
        type: string
      calibration_end:
        description: Calibration end YYYY-MM-DD (UTC; before test)
        required: true
        type: string
      validation_start:
        description: Untouched test start YYYY-MM-DD (UTC)
        required: true
        type: string
      validation_end:
        description: Untouched test end YYYY-MM-DD (UTC)
        required: true
        type: string
      population:
        description: Eligible population
        required: true
        default: FBS_vs_FBS
        type: choice
        options: [FBS_vs_FBS]
      authority_mode:
        description: Result authority
        required: true
        default: shadow_only
        type: choice
        options: [shadow_only, production_candidate]
      as_of_utc:
        description: Immutable point-in-time cutoff UTC
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cfb-margin-fit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Execution readiness
        run: |
          python harness/execution_readiness.py --league cfb \
            --require-package numpy --require-package pandas --require-package pyarrow --require-package scikit-learn \
            --require-file data/cfb/model/cfb_margin_pit_features_v1.parquet \
            --require-module models.cfb.fit_margin_distribution_v1 \
            --output-dir run_artifacts --report run_artifacts/execution_readiness.json
      - name: Fit immutable candidate state
        run: |
          python models/cfb/fit_margin_distribution_v1.py \
            --train-data data/cfb/model/cfb_margin_pit_features_v1.parquet \
            --provenance data/cfb/model/cfb_margin_pit_features_v1.provenance.json \
            --output run_artifacts/cfb_margin_model_state_v1.json \
            --validation-output run_artifacts/cfb_margin_model_validation_v1.json \
            --as-of "$AS_OF" \
            --train-start "$TRAIN_START" \
            --train-end "$TRAIN_END" \
            --calibration-start "$CALIBRATION_START" \
            --calibration-end "$CALIBRATION_END" \
            --validation-start "$VALIDATION_START" \
            --validation-end "$VALIDATION_END"
        env:
          AS_OF: ${{ inputs.as_of_utc }}
          TRAIN_START: ${{ inputs.train_start }}
          TRAIN_END: ${{ inputs.train_end }}
          CALIBRATION_START: ${{ inputs.calibration_start }}
          CALIBRATION_END: ${{ inputs.calibration_end }}
          VALIDATION_START: ${{ inputs.validation_start }}
          VALIDATION_END: ${{ inputs.validation_end }}
      - name: Validate fitted state
        run: python harness/validate_cfb_margin_model_state.py run_artifacts/cfb_margin_model_state_v1.json
      - name: Simulator integrity selftest
        run: python harness/cfb_spread_simulation_validator.py
      - name: Record requested authority
        run: |
          printf '%s\n' '{"authority_mode":"${{ inputs.authority_mode }}","population":"${{ inputs.population }}","note":"workflow output is candidate evidence only; no automatic promotion"}' > run_artifacts/requested_authority.json
      - name: Upload fit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cfb-margin-fit-${{ github.run_id }}
          path: run_artifacts/
          if-no-files-found: error
          retention-days: 90

