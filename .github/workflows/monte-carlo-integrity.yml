name: Monte Carlo Integrity
on:
  workflow_dispatch:
  push:
    branches: [codex/diagnostic-shadow-card-v1]
    paths:
      - 'models/cfb/monte_carlo_v1.py'
      - 'models/mlb/monte_carlo_v1.py'
      - 'harness/validate_monte_carlo_bundle_v1.py'
      - 'tests/test_monte_carlo_reproducibility_v1.py'
      - 'data/contracts/monte_carlo_engine_v1.json'
      - 'data/models/**'
      - '.github/workflows/monte-carlo-integrity.yml'
env:
  PYTHONPATH: ${{ github.workspace }}
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy pytest
      - name: Import preflight
        run: |
          python -c "import models; from models.cfb import monte_carlo_v1; from models.mlb import monte_carlo_v1; print('SIMULATOR_IMPORTS: PASS')"
      - name: Reproducibility tests
        run: python -m pytest -q tests/test_monte_carlo_reproducibility_v1.py
      - name: Validate promoted CFB state
        run: python harness/validate_cfb_margin_model_state.py data/models/cfb/cfb_margin_model_state_v1.json
      - name: Contract presence
        run: |
          python - <<'PY'
          import json
          c=json.load(open('data/contracts/monte_carlo_engine_v1.json'))
          assert c['default_simulations']==100000
          assert c['rng']=='numpy.random.Generator(PCG64)'
          assert c['governance']['action_authority'] is False
          print('MONTE_CARLO_CONTRACT: PASS')
          PY
