name: Daily CFB Research Failure Delivery Drill
on:
  workflow_dispatch:
  push:
    branches: [codex/daily-pipeline-integration-20261101]
    paths: ['daily_research_requests/failure-drill/*.json']
permissions:
  contents: read
  issues: write
jobs:
  failure-drill:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - name: Inject a labeled missing-card failure in the acceptance exercise
        id: injected
        continue-on-error: true
        run: |
          echo '::error title=TEST_ONLY failure drill::Injected missing-card stage; no real forecast is modified.'
          exit 1
      - name: Deliver the explicit injected failure and read it back
        if: ${{ always() && steps.injected.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/daily_research_notify.py --phase failure-drill --drill --report output/failure-drill/delivery.json
      - name: Preserve the delivery receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daily-cfb-failure-drill-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/failure-drill/
          if-no-files-found: error
          retention-days: 90
