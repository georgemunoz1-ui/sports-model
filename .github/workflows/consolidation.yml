name: Consolidation verification
on:
  push:
    branches: [codex/consolidate-all-prs, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-consolidated.txt
      - shell: bash
        run: python -m pytest tests -q | tee /tmp/unit-tests.txt
      - run: python scripts/model_defaults.py > /tmp/selected-models.json
      - run: |
          python -m sportsim --help > /tmp/sportsim-help.txt
          python scripts/run_nfl_integrated.py --help > /tmp/nfl-help.txt
          python scripts/prepare_mlb_current.py --help > /tmp/mlb-help.txt
      - name: Verify MLB calibration acceptance against committed registry
        # This acceptance fixture pins PR46's recovered n=16 state, not future daily grades.
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 46 }}
        shell: bash
        run: |
          python scripts/verify_mlb_calibration_acceptance.py --output /tmp/mlb-calibration-acceptance.json
          python - <<'PYCODE'
          import json
          from pathlib import Path
          expected = json.loads(Path('docs/releases/2026-09-24-mlb-grading/acceptance.json').read_text())
          actual = json.loads(Path('/tmp/mlb-calibration-acceptance.json').read_text())
          if actual != expected:
              raise SystemExit('LOCAL_REMOTE_CALIBRATION_ACCEPTANCE_MISMATCH')
          print('LOCAL_REMOTE_CALIBRATION_ACCEPTANCE_MATCH')
          PYCODE
      - name: Record health independently from software acceptance
        run: |
          set +e
          python harness/healthcheck.py > /tmp/healthcheck.txt 2>&1
          result=$?
          echo "$result" > /tmp/health-exit-code.txt
          echo "Health exit code: $result (see artifact; tests do not grant release clearance)" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Capture exact merged history
        if: always()
        run: |
          git rev-parse HEAD > /tmp/commit.txt
          git status --porcelain > /tmp/worktree-status.txt
          # Repack losslessly; retain every ref and its complete reachable history.
          git for-each-ref --format='%(objectname) %(refname)' > /tmp/refs-before.txt
          git -c pack.window=250 -c pack.depth=50 -c pack.compression=9 repack -a -d -f
          git for-each-ref --format='%(objectname) %(refname)' > /tmp/refs-after.txt
          cmp /tmp/refs-before.txt /tmp/refs-after.txt
          git bundle create /tmp/repository-all.bundle --all
          git bundle verify /tmp/repository-all.bundle
          sha256sum /tmp/repository-all.bundle > /tmp/repository-all.bundle.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consolidation-verification
          compression-level: 9
          if-no-files-found: error
          path: |
            /tmp/mlb-calibration-acceptance.json
            /tmp/unit-tests.txt
            /tmp/selected-models.json
            /tmp/*-help.txt
            /tmp/healthcheck.txt
            /tmp/health-exit-code.txt
            /tmp/commit.txt
            /tmp/worktree-status.txt
            /tmp/repository-all.bundle
            /tmp/repository-all.bundle.sha256
            /tmp/refs-before.txt
            /tmp/refs-after.txt
