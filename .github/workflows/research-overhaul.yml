name: Research integrity and selection
on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/research-overhaul-20261023]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-consolidated.txt
      - name: Integrity, selection, evaluation and preserved-control regressions
        run: >-
          python -m pytest -q
          tests/test_research_selection.py
          tests/test_research_selection_cli.py
          tests/test_validation_registry.py
          tests/test_selection_evaluation.py
          tests/test_overhaul_adversarial.py
          tests/test_overhaul_integration.py
          tests/test_integrity_reporting.py
          tests/test_current_freshness.py
          tests/test_nba_history_scope.py
          tests/test_model_defaults.py
          tests/test_current_runtime_contracts.py
          tests/test_card_disclosures.py
          tests/test_nhl_season_rollover_unittest.py
          tests/test_nhl_atomic_capture.py
      - name: Public research entrypoints
        run: |
          python scripts/run_research_selection.py --help
          python scripts/evaluate_research_selections.py --help
          python scripts/build_operational_rest_candidate.py --help
          python scripts/capture_team_histories.py --help
          python scripts/prepare_initial_baselines.py --help
      - name: Explain verification scope
        if: always()
        run: |
          echo 'These are software and immutable-artifact tests; they grant no predictive validation, default promotion, publication or wagering authority.' >> "$GITHUB_STEP_SUMMARY"
