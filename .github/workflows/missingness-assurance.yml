name: Missingness assurance
on:
  pull_request:
    paths:
      - 'pipelines/**'
      - 'research/**'
      - 'models/**'
      - 'sportsim/**'
      - 'harness/**'
      - 'scripts/**'
      - 'data/model_selection/**'
      - 'tests/**'
      - '.github/workflows/missingness-assurance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-consolidated.txt
      - name: Check runner invocation, readback and release refusal cases
        run: |
          python -m pytest -q tests/test_*missingness*.py tests/test_runtime_acceptance_matrix.py tests/test_validation_registry.py tests/test_research_selection_cli.py
          python harness/release_gate.py --selftest
          python harness/promotion_gate.py --selftest
          python harness/readiness_gate.py --selftest
