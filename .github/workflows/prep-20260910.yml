name: September 10 prep and MLB forensic sources
on:
  push:
    branches: [codex/nfl-wnba-nba-models-v1]
    paths: [research/audits/prep_20260910.py]
permissions:
  contents: read
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Repository health evidence
        run: |
          mkdir -p prep-output
          python harness/healthcheck.py > prep-output/healthcheck.log 2>&1 || echo HEALTHCHECK_FAILED >> prep-output/healthcheck.log
      - run: python research/audits/prep_20260910.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prep-20260910-forensic-sources
          path: prep-output/
          retention-days: 90
