name: news-model-materialization

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: 'Locked candidate id (or all; large all-run may exceed hosted-runner disk)'
        required: true
        default: 'gliner25_base'
        type: string

permissions:
  contents: read

env:
  HF_HOME: ${{ runner.temp }}/hf-home

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Hugging Face downloader only
        run: python -m pip install --disable-pip-version-check 'huggingface_hub>=0.34,<2'
      - name: Materialize exact locked revision and hash files
        run: |
          python -m research.news_information.materialize_models \
            --candidate '${{ inputs.candidate }}' \
            --cache-dir '${{ runner.temp }}/sports-news-model-cache' \
            --receipt-dir '${{ runner.temp }}/sports-news-model-receipts'
      - name: Upload receipts only (never weights)
        uses: actions/upload-artifact@v4
        with:
          name: sports-news-model-receipts-${{ inputs.candidate }}-${{ github.sha }}
          path: ${{ runner.temp }}/sports-news-model-receipts
          if-no-files-found: error
          retention-days: 30
