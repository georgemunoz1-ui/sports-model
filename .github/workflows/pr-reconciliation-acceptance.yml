name: PR reconciliation acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr-reconciliation-acceptance.yml'
      - 'models/common/margins/**'
      - 'pipelines/margins/**'
      - 'sports/rosters.py'
      - 'tests/test_margin_quote_integrity_v2.py'
      - 'tests/test_roster_disclosure_integration.py'
      - 'docs/PR_RECONCILIATION_20261024.md'
permissions:
  contents: read
jobs:
  verify-and-retain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-consolidated.txt
      - name: Verify original forecasts, states and selected numerical sources
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pr-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/pr-evidence/checkout.txt"
          python - <<'PY'
          import json, subprocess
          base = 'c2a00e25282794e52981126217cb115be70398d5'
          protected = ['models/current', 'models/nfl/contextual', 'pipelines/cards/adapters', 'data', 'AUTHORIZATIONS.md']
          changed = subprocess.check_output(['git', 'diff', '--name-status', '--diff-filter=MDR', base, 'HEAD', '--', *protected], text=True)
          assert not changed, 'Protected original files changed: ' + changed
          before = json.loads(subprocess.check_output(['git', 'show', base + ':state.json']))
          after = json.load(open('state.json'))
          assert all(after.get(k) == v for k, v in before.items()), 'Existing state changed'
          prior_journal = subprocess.check_output(['git', 'show', base + ':docs/progress.md'])
          assert open('docs/progress.md', 'rb').read().startswith(prior_journal), 'Journal rewritten'
          print('ORIGINAL_FORECASTS_STATES_DEFAULTS_NUMERICAL_SOURCES_PRESERVED')
          PY
      - name: Full repository and imported research tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests research/tests research/cfb_binary_isotonic_proposal/test_binary_isotonic_repair.py -q \
            --junitxml="$RUNNER_TEMP/pr-evidence/tests.xml" 2>&1 | tee "$RUNNER_TEMP/pr-evidence/tests.log"
      - name: Preserve source history and original current-run reports
        if: always()
        env:
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/pr-evidence"
          git for-each-ref --format='%(objectname) %(refname)' > "$RUNNER_TEMP/pr-evidence/refs.txt"
          git bundle create "$RUNNER_TEMP/pr-evidence/repository-all.bundle" --all
          git bundle verify "$RUNNER_TEMP/pr-evidence/repository-all.bundle"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'pr-evidence'
          files = {f.name: {'sha256': hashlib.sha256(f.read_bytes()).hexdigest(), 'size': f.stat().st_size}
                   for f in sorted(p.iterdir()) if f.is_file()}
          receipt = {'schema': 'pr-reconciliation-evidence.v1', 'run_id': os.environ['GITHUB_RUN_ID'],
              'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'checkout_sha': os.environ['GITHUB_SHA'],
              'head_sha': os.environ['CI_HEAD_SHA'], 'base_sha': os.environ['CI_BASE_SHA'],
              'files': files, 'source_kind': 'ORIGINAL_CURRENT_RUN_FILES',
              'forecast_registration': False, 'wagering_authority': 'OFF'}
          (p / 'manifest.json').write_text(json.dumps(receipt, sort_keys=True, indent=2) + '\n')
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Required acceptance evidence upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-reconciliation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-evidence/
          if-no-files-found: error
          compression-level: 9
          retention-days: 7
