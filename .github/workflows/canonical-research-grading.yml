name: Prospective Research Grading
on:
  push:
    branches: [main]
    paths:
      - 'scripts/canonical_forecasts.py'
      - 'scripts/canonical_results.py'
      - 'scripts/canonical_grading_preflight.py'
      - 'tests/test_canonical_grading_preflight.py'
      - 'pipelines/cards/selection_integration.py'
      - '.github/workflows/canonical-research-grading.yml'
  workflow_dispatch:
  schedule:
    - cron: "45 13 * * *"
concurrency:
  # Serialize against the existing card writer and MLB grading state writer.
  group: mlb-calibration-state-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Check prospective registration readiness
        id: preflight
        continue-on-error: true
        run: |
          python scripts/canonical_grading_preflight.py \
            --report "data/grading/canonical/operations/preflight-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Acquire explicit final evidence for registered forecasts
        id: acquire
        continue-on-error: true
        if: ${{ steps.preflight.outputs.state == 'READY_TO_ACQUIRE' }}
        run: |
          python scripts/canonical_results.py \
            --registry data/grading/canonical/registry.json \
            --output "data/grading/canonical/results/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Check only this attempt's acquired results
        id: current_results
        continue-on-error: true
        if: ${{ always() && steps.preflight.outputs.state == 'READY_TO_ACQUIRE' }}
        run: |
          python scripts/canonical_grading_preflight.py \
            --check-current-results "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            --report "data/grading/canonical/operations/results-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Grade immutable prospective forecasts and registered selection sidecars
        id: grade
        continue-on-error: true
        if: ${{ always() && steps.current_results.outputs.state == 'CURRENT_ATTEMPT_RESULTS_READY' }}
        run: |
          python scripts/canonical_forecasts.py grade \
            --results "data/grading/canonical/results/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/results.json" \
            --report "data/grading/canonical/attempts/grade-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
      - name: Persist source evidence, grades and failure reports
        if: always()
        run: |
          git config user.name "sports-model-calibration-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -d data/grading/canonical ]; then
            git add data/grading/canonical/
            git reset -- 'data/grading/canonical/*.lock' || true
            if ! git diff --cached --quiet; then
              git commit -m "Persist prospective research grades $GITHUB_RUN_ID"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi
      - name: Publish research-only status
        if: always()
        run: |
          echo '## Prospective research grading' >> "$GITHUB_STEP_SUMMARY"
          echo 'Source-unverified research cohort; certified calibration and wagering remain OFF.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Registered selection sidecars are settled separately; NO_PICK never earns an abstention win. Historical cards are not retro-registered.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/grading/canonical/summary.json ]; then cat data/grading/canonical/summary.json >> "$GITHUB_STEP_SUMMARY"; fi
          for report in "data/grading/canonical/operations/preflight-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json" "data/grading/canonical/operations/results-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json" "data/grading/canonical/attempts/grade-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json" "data/grading/canonical/results/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/report.json"; do
            if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Fail incomplete acquisition or rejected grades
        if: ${{ steps.preflight.outcome == 'failure' || steps.acquire.outcome == 'failure' || steps.current_results.outcome == 'failure' || steps.grade.outcome == 'failure' || (steps.preflight.outputs.state == 'READY_TO_ACQUIRE' && steps.grade.outcome == 'skipped') }}
        run: exit 1
