name: Diagnostic Shadow Card

on:
  workflow_dispatch:
    inputs:
      card_date:
        description: "Forecast date, YYYY-MM-DD"
        required: true
        type: string
      league:
        description: "League to forecast"
        required: true
        default: "mlb"
        type: choice
        options:
          - mlb
          - cfb
          - nfl
          - wnba
          - nba
      as_of_utc:
        description: "Requested point-in-time cutoff timestamp (ISO-8601 UTC)"
        required: true
        type: string
      simulation_count:
        description: "Paths per eligible game"
        required: true
        default: "100000"
        type: string
      mode:
        description: "Execution mode"
        required: true
        default: "diagnostic_shadow"
        type: choice
        options:
          - diagnostic_shadow
      publish_summary:
        description: "Render the full Markdown card in the run summary"
        required: true
        default: true
        type: boolean
  repository_dispatch:
    types: [shadow-card-request]
  push:
    paths:
      - "card_requests/*.json"

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  generate-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve request
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CARD_DATE: ${{ inputs.card_date }}
          INPUT_LEAGUE: ${{ inputs.league }}
          INPUT_AS_OF_UTC: ${{ inputs.as_of_utc }}
          INPUT_SIMULATION_COUNT: ${{ inputs.simulation_count }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_PUBLISH_SUMMARY: ${{ inputs.publish_summary }}
          DISPATCH_REQUEST_ID: ${{ github.event.client_payload.request_id }}
          DISPATCH_CARD_DATE: ${{ github.event.client_payload.card_date }}
          DISPATCH_LEAGUE: ${{ github.event.client_payload.league }}
          DISPATCH_AS_OF_UTC: ${{ github.event.client_payload.as_of_utc }}
          DISPATCH_SIMULATION_COUNT: ${{ github.event.client_payload.simulation_count }}
          DISPATCH_MODE: ${{ github.event.client_payload.mode }}
          DISPATCH_PUBLISH_SUMMARY: ${{ github.event.client_payload.publish_summary }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          event = os.environ["EVENT_NAME"]
          if event == "push":
              names = subprocess.check_output(
                  ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", os.environ["GITHUB_SHA"]],
                  text=True,
              ).splitlines()
              candidates = sorted(n for n in names if n.startswith("card_requests/") and n.endswith(".json"))
              if not candidates:
                  raise SystemExit("CARD_REQUEST_FILE_NOT_FOUND")
              request_path = Path(candidates[-1])
              req = json.loads(request_path.read_text())
              request_id = str(req.get("request_id") or request_path.stem)
              card_date = str(req["card_date"])
              league = str(req["league"]).lower()
              as_of_utc = str(req["as_of_utc"])
              simulation_count = str(req.get("simulation_count", 100000))
              mode = str(req.get("mode", "diagnostic_shadow"))
              publish_summary = str(req.get("publish_summary", True)).lower()
          elif event == "repository_dispatch":
              request_id = os.environ.get("DISPATCH_REQUEST_ID") or f"repo-dispatch-{os.environ['GITHUB_RUN_ID']}"
              card_date = os.environ["DISPATCH_CARD_DATE"]
              league = os.environ["DISPATCH_LEAGUE"].lower()
              as_of_utc = os.environ["DISPATCH_AS_OF_UTC"]
              simulation_count = os.environ.get("DISPATCH_SIMULATION_COUNT") or "100000"
              mode = os.environ.get("DISPATCH_MODE") or "diagnostic_shadow"
              publish_summary = (os.environ.get("DISPATCH_PUBLISH_SUMMARY") or "true").lower()
          else:
              request_id = f"manual-{os.environ['GITHUB_RUN_ID']}"
              card_date = os.environ["INPUT_CARD_DATE"]
              league = os.environ["INPUT_LEAGUE"].lower()
              as_of_utc = os.environ["INPUT_AS_OF_UTC"]
              simulation_count = os.environ.get("INPUT_SIMULATION_COUNT") or "100000"
              mode = os.environ.get("INPUT_MODE") or "diagnostic_shadow"
              publish_summary = (os.environ.get("INPUT_PUBLISH_SUMMARY") or "true").lower()

          if league not in {"mlb", "cfb", "nfl", "wnba", "nba"}:
              raise SystemExit(f"unsupported league: {league}")

          outputs = {
              "request_id": request_id,
              "card_date": card_date,
              "league": league,
              "as_of_utc": as_of_utc,
              "simulation_count": simulation_count,
              "mode": mode,
              "publish_summary": publish_summary,
          }
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              for k, v in outputs.items():
                  f.write(f"{k}={v}\n")
          print(json.dumps(outputs, indent=2, sort_keys=True))
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pandas pyarrow scikit-learn nflreadpy

      - name: Validate inputs
        shell: bash
        env:
          CARD_DATE: ${{ steps.resolve.outputs.card_date }}
          AS_OF_UTC: ${{ steps.resolve.outputs.as_of_utc }}
          SIMULATION_COUNT: ${{ steps.resolve.outputs.simulation_count }}
          MODE: ${{ steps.resolve.outputs.mode }}
        run: |
          python - <<'PY'
          import os
          from datetime import date, datetime
          date.fromisoformat(os.environ["CARD_DATE"])
          parsed = datetime.fromisoformat(os.environ["AS_OF_UTC"].replace("Z", "+00:00"))
          if parsed.tzinfo is None:
              raise SystemExit("as_of_utc must include timezone")
          n = int(os.environ["SIMULATION_COUNT"])
          if n < 50_000:
              raise SystemExit("simulation_count must be >= 50000")
          if os.environ["MODE"] != "diagnostic_shadow":
              raise SystemExit("unsupported mode")
          PY

      - name: Build fresh NFL event package
        if: ${{ steps.resolve.outputs.league == 'nfl' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CARD_DATE: ${{ steps.resolve.outputs.card_date }}
          AS_OF_UTC: ${{ steps.resolve.outputs.as_of_utc }}
        run: |
          rm -rf /tmp/week2-proof
          mkdir -p /tmp/week2-proof
          gh run download 35030382886 -n week2-reconciliation -D /tmp/week2-proof
          PACKAGE_PATH="data/nfl/contextual_v1/fresh_${CARD_DATE}_${GITHUB_RUN_ID}.json"
          python scripts/build_fresh_nfl_event_package.py \
            --date "$CARD_DATE" \
            --as-of-utc "$AS_OF_UTC" \
            --state-proof /tmp/week2-proof \
            --output "$PACKAGE_PATH"
          echo "NFL_CONTEXT_PACKAGE=$PACKAGE_PATH" >> "$GITHUB_ENV"
      - name: Generate diagnostic card
        id: forecast
        continue-on-error: true
        shell: bash
        env:
          CARD_DATE: ${{ steps.resolve.outputs.card_date }}
          LEAGUE: ${{ steps.resolve.outputs.league }}
          AS_OF_UTC: ${{ steps.resolve.outputs.as_of_utc }}
          SIMULATION_COUNT: ${{ steps.resolve.outputs.simulation_count }}
        run: |
          mkdir -p output
          rm -rf output/card
          set +e
          python scripts/generate_card_force.py \
            --date "$CARD_DATE" \
            --league "$LEAGUE" \
            --as-of-utc "$AS_OF_UTC" \
            --simulations "$SIMULATION_COUNT" \
            --output-dir output/card \
            2>&1 | tee output/card/run.log
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Check PIT cutoff integrity
        if: ${{ always() && hashFiles('output/card/diagnostic_card.json') != '' }}
        shell: bash
        run: |
          python scripts/check_cutoff_integrity.py \
            --card output/card/diagnostic_card.json \
            | tee output/card/pit_integrity.json

      - name: Investigate MLB Analytic P vs Stochastic Sim P
        if: ${{ always() && steps.resolve.outputs.league == 'mlb' && hashFiles('output/card/diagnostic_card.json') != '' }}
        shell: bash
        run: |
          python scripts/investigate_mlb_model_sim_divergence.py \
            --card output/card/diagnostic_card.json \
            --output-dir output/card/divergence

      - name: Validate card and write manifest
        id: validate
        shell: bash
        env:
          REQUEST_ID: ${{ steps.resolve.outputs.request_id }}
          CARD_DATE: ${{ steps.resolve.outputs.card_date }}
          LEAGUE: ${{ steps.resolve.outputs.league }}
          AS_OF_UTC: ${{ steps.resolve.outputs.as_of_utc }}
          SIMULATION_COUNT: ${{ steps.resolve.outputs.simulation_count }}
          FORECAST_EXIT_CODE: ${{ steps.forecast.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          out = Path("output/card")
          league = os.environ["LEAGUE"].lower()
          required = [
              out / "diagnostic_card.json",
              out / "diagnostic_card.csv",
              out / "diagnostic_card.md",
              out / "pit_integrity.json",
          ]
          if league == "mlb":
              required.extend(
                  [
                      out / "divergence/divergence_report.json",
                      out / "divergence/divergence_report.csv",
                      out / "divergence/divergence_report.md",
                  ]
              )
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit(f"missing card artifacts: {missing}")

          card = json.loads((out / "diagnostic_card.json").read_text())
          scheduled = int(card.get("scheduled_game_count", 0))
          forecasted = int(card.get("forecast_count", 0))
          post_start = sum(1 for row in card.get("forecasts", []) if row.get("forecast_status") == "POST_START")
          pregame = max(0, scheduled - post_start)
          coverage = float(card.get("pregame_coverage", 0.0))
          incidents = card.get("incidents", [])
          exit_code = int(os.environ.get("FORECAST_EXIT_CODE") or 0)
          pit = card.get("pit_provenance") or {}

          overall_status = "PASS"
          if pregame > 0 and forecasted == 0:
              overall_status = "FAIL"
          if card.get("coverage_breach_event_ids"):
              overall_status = "FAIL"
          if exit_code != 0:
              overall_status = "FAIL"

          if pit.get("pit_gate") == "WARN":
              print(
                  f"::warning title=PIT provenance::{pit.get('pit_status')} "
                  f"requested={pit.get('requested_as_of_utc')} "
                  f"actual={pit.get('actual_data_vintage_utc')} "
                  f"delta_seconds={pit.get('pit_delta_seconds')}"
              )

          artifacts = {
              "json": "output/card/diagnostic_card.json",
              "csv": "output/card/diagnostic_card.csv",
              "markdown": "output/card/diagnostic_card.md",
              "pit_integrity": "output/card/pit_integrity.json",
              "log": "output/card/run.log",
          }
          if league == "mlb":
              artifacts["divergence_json"] = "output/card/divergence/divergence_report.json"
              artifacts["divergence_csv"] = "output/card/divergence/divergence_report.csv"
              artifacts["divergence_markdown"] = "output/card/divergence/divergence_report.md"

          manifest = {
              "request_id": os.environ["REQUEST_ID"],
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "github_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "git_sha": os.environ.get("GITHUB_SHA"),
              "card_date": os.environ["CARD_DATE"],
              "as_of_utc": os.environ["AS_OF_UTC"],
              "requested_as_of_utc": card.get("requested_as_of_utc", os.environ["AS_OF_UTC"]),
              "actual_data_vintage_utc": pit.get("actual_data_vintage_utc"),
              "generated_at_utc": card.get("generated_at_utc"),
              "max_source_timestamp_utc": pit.get("max_source_timestamp_utc"),
              "min_source_timestamp_utc": pit.get("min_source_timestamp_utc"),
              "pit_mode": pit.get("pit_mode"),
              "pit_reconstruction_supported": pit.get("pit_reconstruction_supported"),
              "pit_delta_seconds": pit.get("pit_delta_seconds"),
              "pit_status": pit.get("pit_status"),
              "pit_reason": pit.get("pit_reason"),
              "pit_threshold_seconds": pit.get("pit_threshold_seconds"),
              "data_vintage_basis": pit.get("data_vintage_basis"),
              "mode": "DIAGNOSTIC_SHADOW",
              "league": league.upper(),
              "simulation_count": int(os.environ["SIMULATION_COUNT"]),
              "scheduled_events": scheduled,
              "pregame_events": pregame,
              "forecasted_events": forecasted,
              "forecast_coverage_pct": coverage,
              "incident_count": len(incidents),
              "generator_exit_code": exit_code,
              "card_artifacts": artifacts,
              "action_authority": False,
              "market_overlay_enabled": False,
              "overall_status": overall_status,
          }
          (out / "manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          print(json.dumps(manifest, indent=2, sort_keys=True))
          if overall_status != "PASS":
              raise SystemExit("diagnostic card validation failed")
          PY

      - name: Publish card summary
        if: ${{ always() && steps.resolve.outputs.publish_summary == 'true' }}
        shell: bash
        run: |
          if [ -f output/card/manifest.json ]; then
            echo '## Forecast Run Manifest' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat output/card/manifest.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f output/card/diagnostic_card.md ]; then
            cat output/card/diagnostic_card.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f output/card/divergence/divergence_report.md ]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            cat output/card/divergence/divergence_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnostic card artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-shadow-card-${{ steps.resolve.outputs.league }}-${{ steps.resolve.outputs.card_date }}-${{ steps.resolve.outputs.request_id }}-${{ github.run_id }}
          path: output/card/
          if-no-files-found: error
          retention-days: 30
