name: All-sports roster contracts
on:
  push:
    paths: ['sports/rosters.py', 'scripts/prepare_rosters.py', 'scripts/audit_roster_cards.py', 'scripts/generate_card_force.py', 'scripts/run_nfl_integrated.py', 'tests/test_rosters.py', 'tests/test_roster_disclosure_integration.py', 'tests/test_card_disclosures.py', 'pipelines/cards/disclosures.py', '.github/workflows/roster-contracts.yml']
  pull_request:
    paths: ['sports/rosters.py', 'scripts/prepare_rosters.py', 'scripts/audit_roster_cards.py', 'scripts/generate_card_force.py', 'scripts/run_nfl_integrated.py', 'tests/test_rosters.py', 'tests/test_roster_disclosure_integration.py', 'tests/test_card_disclosures.py', 'pipelines/cards/disclosures.py', '.github/workflows/roster-contracts.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest numpy pandas pyarrow scikit-learn
      - name: Source, identity, chronology, scenarios and card integration
        run: python -m pytest -q tests/test_rosters.py tests/test_roster_disclosure_integration.py tests/test_card_disclosures.py tests/test_model_defaults.py tests/test_cross_sport_distributions.py tests/test_current_runtime_contracts.py tests/test_nfl_personnel_resolution.py tests/test_current_sports_data.py
      - name: CLI entry points
        run: |
          python scripts/prepare_rosters.py --help
          python scripts/audit_roster_cards.py --help
          python scripts/generate_card_force.py --help
          python scripts/run_nfl_integrated.py --help
