name: Standing health triage evidence
on:
  push:
    branches: [codex/standing-health-triage-20260916]
  pull_request:
    branches: [main]
    paths:
      - 'scripts/standing_health_triage.py'
      - 'harness/recovery_jobs.py'
      - 'harness/ingest_lancebroz.py'
      - 'tests/test_standing_health_triage.py'
      - 'tests/test_standing_health_workflow.py'
      - '.github/workflows/standing-health-triage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve clean checkout identity
        id: identity
        run: |
          mkdir -p "$RUNNER_TEMP/health-triage"
          git rev-parse HEAD > "$RUNNER_TEMP/health-triage/commit.txt"
          git status --porcelain > "$RUNNER_TEMP/health-triage/status-before.txt"
          test ! -s "$RUNNER_TEMP/health-triage/status-before.txt"
          sha256sum requirements-consolidated.txt requirements-nfl-context.txt > "$RUNNER_TEMP/health-triage/requirements.sha256"
      - name: Install dependencies
        id: dependencies
        run: pip install -r requirements-consolidated.txt
      - name: Regression checks
        id: regressions
        run: |
          set -o pipefail
          python -m pytest tests -q | tee "$RUNNER_TEMP/health-triage/tests.txt"
      - name: Recovery refusal checks
        id: mutants
        if: always() && steps.dependencies.outcome == 'success'
        run: python harness/recovery_jobs.py --mutants > "$RUNNER_TEMP/health-triage/recovery-mutants.txt"
      - name: Capture triage without skipping independent evidence
        id: triage
        if: always() && steps.dependencies.outcome == 'success'
        run: |
          set +e
          python scripts/standing_health_triage.py > "$RUNNER_TEMP/health-triage/triage.json" 2> "$RUNNER_TEMP/health-triage/triage.stderr.txt"
          result=$?
          set -e
          echo "$result" > "$RUNNER_TEMP/health-triage/triage-exit-code.txt"
      - name: Capture execution environment
        id: environment
        if: always() && steps.dependencies.outcome == 'success'
        run: |
          pip freeze --all > "$RUNNER_TEMP/health-triage/pip-freeze.txt"
          python -VV > "$RUNNER_TEMP/health-triage/python.txt"
      - name: Recover explicitly named candidate snapshot
        id: archive
        if: always() && steps.identity.outcome == 'success'
        uses: actions/checkout@v4
        with:
          repository: lancebroz/mlb-pitcher-data
          ref: d49271818de98ee3b582dce134bb724861dda859
          path: recovered-pitch-archive
          sparse-checkout: data/raw/2026/daily
          persist-credentials: false
      - name: Verify restored bytes and parser schema
        id: archive_verification
        if: always() && steps.archive.outcome == 'success' && steps.dependencies.outcome == 'success'
        env:
          SPORTSMODEL_LANCEBROZ_ROOT: ${{ github.workspace }}/recovered-pitch-archive
          SPORTSMODEL_LANCEBROZ_COMMIT: d49271818de98ee3b582dce134bb724861dda859
        run: |
          python - <<'PY'
          import os,json,pathlib,datetime
          import pandas as pd
          from harness import ingest_lancebroz as m
          r=m.source_health()
          r['retrieved_at_utc']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          r['source_kind']='EXPLICIT_RECOVERY_CANDIDATE_NOT_ORIGINAL_HISTORICAL_RECEIPT'
          r['required_columns']=['game_pk','game_date','top_bottom','pitcher_id','at_bat_number','events']
          r['parser_problems']=[]
          for obj in r['objects']:
              try:
                  frame=pd.read_parquet(pathlib.Path(m.SRC)/obj['path'],columns=r['required_columns'])
                  _, rejects=m.derive_day(frame)
                  obj['rows']=len(frame); obj['parser_rejects']=dict(rejects)
              except Exception as e: r['parser_problems'].append({'path':obj['path'],'error':str(e)})
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'health-triage/archive-verification.json'
          p.write_text(json.dumps(r,indent=2))
          print('ARCHIVE_VERIFICATION='+json.dumps({k:v for k,v in r.items() if k!='objects'}))
          assert r['ok'] and not r['parser_problems']
          PY
      - name: Record mandatory health result
        id: health
        if: always()
        env:
          SPORTSMODEL_LANCEBROZ_ROOT: ${{ github.workspace }}/recovered-pitch-archive
          SPORTSMODEL_LANCEBROZ_COMMIT: d49271818de98ee3b582dce134bb724861dda859
        run: |
          set +e
          python harness/healthcheck.py > "$RUNNER_TEMP/health-triage/health.log" 2>&1
          result=$?
          set -e
          echo "$result" > "$RUNNER_TEMP/health-triage/health-exit-code.txt"
          git status --porcelain > "$RUNNER_TEMP/health-triage/status-after.txt"
      - name: Publish exact evidence manifest
        id: manifest
        if: always()
        run: |
          python - <<'PY'
          import os,pathlib,hashlib,json,datetime
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'health-triage'
          r={'created_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'commit':os.environ['GITHUB_SHA'],'workflow_run_id':os.environ['GITHUB_RUN_ID'],'official_release_eligible':False,'action_authority':'OFF','files':{f.name:hashlib.sha256(f.read_bytes()).hexdigest() for f in p.iterdir() if f.is_file()}}
          (p/'manifest.json').write_text(json.dumps(r,indent=2))
          print('TRIAGE_MANIFEST='+json.dumps(r))
          for name in ['tests.txt','triage-exit-code.txt','triage.json','health-exit-code.txt','archive-verification.json']:
              f=p/name
              if f.exists(): print('TRIAGE_FILE='+json.dumps({'name':name,'content':f.read_text()}))
          h=p/'health.log'
          if h.exists(): print('TRIAGE_HEALTH='+json.dumps([s for s in h.read_text().splitlines() if s.startswith(('[FAIL]', '[WARN]', 'REPOSITORY_HEALTH_'))]))
          PY
      - uses: actions/upload-artifact@v4
        id: evidence_upload
        if: always()
        with:
          name: standing-health-triage-evidence
          if-no-files-found: error
          path: ${{ runner.temp }}/health-triage/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        id: archive_upload
        if: always() && steps.archive_verification.outcome == 'success'
        with:
          if-no-files-found: error
          name: pinned-pitch-recovery-candidate
          path: recovered-pitch-archive/data/raw/2026/daily/
          retention-days: 90
      - name: Enforce all results after evidence upload
        if: always()
        env:
          IDENTITY: ${{ steps.identity.outcome }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          REGRESSIONS: ${{ steps.regressions.outcome }}
          MUTANTS: ${{ steps.mutants.outcome }}
          TRIAGE: ${{ steps.triage.outcome }}
          ENVIRONMENT: ${{ steps.environment.outcome }}
          ARCHIVE: ${{ steps.archive.outcome }}
          ARCHIVE_VERIFICATION: ${{ steps.archive_verification.outcome }}
          HEALTH: ${{ steps.health.outcome }}
          MANIFEST: ${{ steps.manifest.outcome }}
          EVIDENCE_UPLOAD: ${{ steps.evidence_upload.outcome }}
          ARCHIVE_UPLOAD: ${{ steps.archive_upload.outcome }}
        run: |
          result=0
          for phase in IDENTITY DEPENDENCIES REGRESSIONS MUTANTS TRIAGE ENVIRONMENT ARCHIVE ARCHIVE_VERIFICATION HEALTH MANIFEST EVIDENCE_UPLOAD ARCHIVE_UPLOAD; do
            if [ "${!phase}" != success ]; then
              echo "::error::$phase did not succeed: ${!phase}"
              result=1
            fi
          done
          for check in triage health; do
            path="$RUNNER_TEMP/health-triage/$check-exit-code.txt"
            if [ ! -f "$path" ] || [ "$(cat "$path")" != 0 ]; then
              echo "::error::$check failed or its exit-code evidence is missing"
              result=1
            fi
          done
          exit "$result"
