name: September 23 team history refresh
on:
  push:
    branches: [codex/slate-20260923-2125]
    paths: ['.github/workflows/slate-20260923-history.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/capture_team_histories.py --output history
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slate-20260923-history
          path: history
          retention-days: 90
