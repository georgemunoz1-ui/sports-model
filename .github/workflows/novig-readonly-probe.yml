name: Novig read-only connection probe
on:
  workflow_dispatch:
    inputs:
      host:
        type: choice
        options:
          - https://api.paper.novig.com
          - https://api.novig.com
        default: https://api.paper.novig.com
      league:
        type: string
        default: NFL
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.32,<3' 'cryptography>=43,<47'
      - name: Signed read-only catalog request
        env:
          NOVIG_HOST: ${{ inputs.host }}
          NOVIG_LEAGUE: ${{ inputs.league }}
          NOVIG_KEY_ID: ${{ secrets.NOVIG_READ_KEY_ID }}
          NOVIG_PRIVATE_PEM: ${{ secrets.NOVIG_READ_PRIVATE_PEM }}
        shell: bash
        run: |
          set -euo pipefail
          export NOVIG_PEM="$RUNNER_TEMP/novig-read.pem"
          trap 'rm -f "$NOVIG_PEM"' EXIT
          umask 077
          printf '%s' "$NOVIG_PRIVATE_PEM" > "$NOVIG_PEM"
          unset NOVIG_PRIVATE_PEM
          python integrations/novig/catalog_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novig-readonly-${{ github.run_id }}
          path: novig_capture/
          if-no-files-found: warn
          retention-days: 7
