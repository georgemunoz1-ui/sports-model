name: October 6 card source recovery
on:
  push:
    branches: [codex/oct6-card-source-recovery]
    paths: [.github/workflows/oct6-card-source-recovery.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 43ad83382af067b019a086d45d23569497ca6e08
      - name: Export verified public-data derived fixture through retained job log
        shell: python
        run: |
          import pathlib, hashlib, base64, gzip
          b=pathlib.Path('data/cfb/model/cfb_v1_features.parquet').read_bytes()
          assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()=='a87a511937d852cc739f1d2cec2edd52cd7b9c64'
          print('CFB_FIXTURE_SHA256='+hashlib.sha256(b).hexdigest())
          encoded=base64.b64encode(gzip.compress(b,mtime=0)).decode()
          for i in range(0,len(encoded),3000): print('CFB_FIXTURE_CHUNK='+str(i//3000)+':'+encoded[i:i+3000])
          print('CFB_FIXTURE_END='+str(len(encoded)))
