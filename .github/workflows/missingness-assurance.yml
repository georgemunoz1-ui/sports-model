name: Missingness assurance
on:
  pull_request: {}
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-consolidated.txt
      - name: Verify native missingness invocation and refusal paths
        run: python -m pytest -q tests/test_nba_personnel_minutes.py tests/test_cfb_personnel_v2.py tests/test_efficiency_integrity.py
