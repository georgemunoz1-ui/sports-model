name: news-model-materialization

"on":
  workflow_dispatch: {}
  push:
    branches:
      - feature/sports-news-information-state
    paths:
      - .github/workflows/news-model-materialization.yml
      - research/news_information/MATERIALIZE_ALL_TRIGGER_20260908.txt

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - bge_reranker_v2_m3
          - gliner25_base
          - sports_injury_ner
          - nuner_zero
          - deberta_nli
          - nuextract3
          - sportsbert
          - modernbert_base
          - finbert_control
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face downloader only
        run: python -m pip install --disable-pip-version-check "huggingface_hub>=0.34,<2"

      - name: Materialize exact locked revision and hash files
        env:
          CANDIDATE: ${{ matrix.candidate }}
        run: >-
          python -m research.news_information.materialize_models
          --candidate "$CANDIDATE"
          --cache-dir "$RUNNER_TEMP/sports-news-model-cache"
          --receipt-dir "$RUNNER_TEMP/sports-news-model-receipts/$CANDIDATE"

      - name: Upload receipt only (never weights)
        uses: actions/upload-artifact@v4
        with:
          name: sports-news-model-receipt-${{ matrix.candidate }}-${{ github.sha }}
          path: ${{ runner.temp }}/sports-news-model-receipts/${{ matrix.candidate }}
          if-no-files-found: error
          retention-days: 30
